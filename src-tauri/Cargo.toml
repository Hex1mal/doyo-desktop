[package]
name = "doyo"
version.workspace = true
edition.workspace = true
license.workspace = true

# Android loads the app as a shared library rather than executing a binary, so
# the crate has to produce a cdylib as well. The name stays `doyo`, so
# main.rs still links the rlib and the desktop binary is unchanged.
[lib]
name = "doyo"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true
doyo-core = { path = "../core" }

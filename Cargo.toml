[workspace]
members = ["core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/Hex1mal/doyo-desktop"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.32", features = ["bundled", "vtab", "array", "column_decltype", "modern_sqlite"] }
tokio = { version = "1", features = ["full"] }
